name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.19.0']
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Build web
        run: npm run build:web
      
      - name: Type check
        run: npm run typecheck
      
      - name: Lint
        run: npm run lint
      
      - name: Test
        run: npm test

      - name: Windows spawn hide + CLI lifecycle
        if: runner.os == 'Windows'
        shell: bash
        run: npx vitest run tests/windows-spawn.test.ts src/daemon/win-hide.test.ts
      
      - name: Pack tarball
        run: npm pack
      
      - name: Install Pi SDK
        run: npm install -g @earendil-works/pi-coding-agent
      
      - name: Test pi install
        shell: bash
        run: |
          # Get version from package.json
          VERSION=$(node -p "require('./package.json').version")
          TARBALL="pi-agent-bot-${VERSION}.tgz"
          echo "Testing tarball: $TARBALL"
          
          # Extract tarball to temp dir
          mkdir -p test-package
          tar -xzf "$TARBALL" -C test-package --strip-components=1
          cd test-package
          
          # Verify Pi manifest and extension exist
          if [ ! -f package.json ]; then
            echo "package.json not found"
            exit 1
          fi
          
          # Check for Pi manifest
          node -p "const pkg = require('./package.json'); pkg.pi ? 'Pi manifest found' : process.exit(1)"
          
          # Check extension file exists
          if [ ! -f dist/respire-extension/index.js ]; then
            echo "Pi extension not found"
            exit 1
          fi
          
          echo "Pi package structure verified"
      
      - name: E2E Smoke Test
        shell: bash
        run: |
          # Get version from package.json (use relative path from workspace)
          cd "${{ github.workspace }}"
          VERSION=$(node -p "require('./package.json').version")
          echo "Testing version: $VERSION"
          
          # Install tarball
          mkdir -p /tmp/e2e-test && cd /tmp/e2e-test
          npm init -y
          TARBALL_PATH="${{ github.workspace }}/pi-agent-bot-${VERSION}.tgz"
          # Convert Windows path to Unix path if needed
          if [[ "$OSTYPE" == "msys" ]] || [[ "$OSTYPE" == "win32" ]]; then
            TARBALL_PATH="$(cygpath -u "$TARBALL_PATH")"
          fi
          npm install "$TARBALL_PATH"
          
          # Start daemon in background
          node node_modules/pi-agent-bot/dist/cli.js serve --dev &
          DAEMON_PID=$!
          
          # Wait for daemon to start
          sleep 5
          
          # Test health endpoint
          curl -f http://localhost:8787/health || (echo "Health check failed" && kill $DAEMON_PID && exit 1)
          
          # Test GUI
          curl -s http://localhost:8787/ | grep -i "<!doctype html>" || (echo "GUI not loading" && kill $DAEMON_PID && exit 1)
          
          # Create a bot - response is now {success: true, data: {bot: {...}}}
          RESPONSE=$(curl -s -X POST http://localhost:8787/api/bots \
            -H "Content-Type: application/json" \
            -d '{"name":"TestBot","role":"assistant","instructions":"Test","model":{"provider":"mock","modelId":"test"}}')
          echo "Bot creation response: $RESPONSE"
          
          # Extract bot ID from {success: true, data: {bot: {id: "..."}}}
          BOT_ID=$(echo "$RESPONSE" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          
          if [ -z "$BOT_ID" ]; then
            echo "Failed to create bot or extract ID"
            echo "Response: $RESPONSE"
            kill $DAEMON_PID
            exit 1
          fi
          
          echo "Created bot: $BOT_ID"
          
          # Test SSE endpoint (just check it connects)
          timeout 2 curl -N http://localhost:8787/api/events || true
          
          # Cleanup
          kill $DAEMON_PID
          
          echo "E2E smoke test passed!"
      
      - name: Test Global Install (npm)
        shell: bash
        run: |
          # Get version
          cd "${{ github.workspace }}"
          VERSION=$(node -p "require('./package.json').version")
          TARBALL_PATH="${{ github.workspace }}/pi-agent-bot-${VERSION}.tgz"
          
          # Convert path for Windows
          if [[ "$OSTYPE" == "msys" ]] || [[ "$OSTYPE" == "win32" ]]; then
            TARBALL_PATH="$(cygpath -u "$TARBALL_PATH")"
          fi
          
          echo "=== Testing npm global install ==="
          npm install -g "$TARBALL_PATH"
          
          # Verify bin is on PATH
          which pi-bot || (echo "ERROR: pi-bot not on PATH" && exit 1)
          pi-bot --version || exit 1
          
          # Create temp test directory (different from package install)
          TEST_CWD=$(mktemp -d)
          cd "$TEST_CWD"
          echo "Testing from: $(pwd)"
          
          # Start daemon without browser
          echo "Starting daemon..."
          pi-bot open --no-browser &
          OPEN_PID=$!
          
          # Wait for daemon to be ready
          for i in {1..30}; do
            if curl -f http://localhost:8787/health 2>/dev/null; then
              echo "✓ Daemon is reachable"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "ERROR: Daemon failed to start within 30s"
              exit 1
            fi
            sleep 1
          done
          
          # Test web UI serves correctly
          echo "Testing web UI..."
          curl -f http://localhost:8787/ | grep -q "<!DOCTYPE html>" || (echo "ERROR: index.html not served" && exit 1)
          echo "✓ index.html served successfully"
          
          # Test assets
          ASSET_URL=$(curl -s http://localhost:8787/ | grep -o '/assets/[^"]*\.js' | head -1)
          if [ -n "$ASSET_URL" ]; then
            curl -f "http://localhost:8787$ASSET_URL" > /dev/null || (echo "ERROR: Asset $ASSET_URL not served" && exit 1)
            echo "✓ Asset served successfully"
          fi
          
          # Test status command
          pi-bot status || (echo "ERROR: pi-bot status failed" && exit 1)
          echo "✓ pi-bot status works"
          
          # Stop daemon
          pi-bot stop || (echo "ERROR: pi-bot stop failed" && exit 1)
          echo "✓ pi-bot stop works"
          
          # Verify it stopped
          sleep 2
          if pi-bot status 2>/dev/null; then
            echo "ERROR: Daemon still running after stop"
            exit 1
          fi
          echo "✓ Daemon stopped successfully"
          
          # Cleanup
          cd "${{ github.workspace }}"
          rm -rf "$TEST_CWD"
          echo "✓ npm global install test passed"

  e2e-gui:
    name: e2e-gui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build daemon and web
        shell: bash
        run: |
          npm run build
          npm run build:web
          npm run copy-web

      - name: Install Playwright Chromium
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - name: Run GUI E2E
        run: npm run test:e2e

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.os }}
          path: |
            e2e/screenshots/
            playwright-report/
            test-results/

name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.19.0']
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Build web
        run: npm run build:web
      
      - name: Type check
        run: npm run typecheck
      
      - name: Lint
        run: npm run lint
      
      - name: Test
        run: npm test
      
      - name: Pack tarball
        run: npm pack
      
      - name: Install Pi SDK
        run: npm install -g @earendil-works/pi-coding-agent
      
      - name: Test pi install
        shell: bash
        run: |
          # Get version from package.json
          VERSION=$(node -p "require('./package.json').version")
          TARBALL="pi-agent-bot-${VERSION}.tgz"
          echo "Testing tarball: $TARBALL"
          
          # Extract tarball to temp dir
          mkdir -p /tmp/pi-bot-test
          tar -xzf "$TARBALL" -C /tmp/pi-bot-test --strip-components=1
          
          # Verify Pi manifest and extension exist
          if [ ! -f /tmp/pi-bot-test/package.json ]; then
            echo "package.json not found"
            exit 1
          fi
          
          # Check for Pi manifest
          node -p "const pkg = require('/tmp/pi-bot-test/package.json'); pkg.pi ? 'Pi manifest found' : process.exit(1)"
          
          # Check extension file exists
          if [ ! -f /tmp/pi-bot-test/dist/respire-extension/index.js ]; then
            echo "Pi extension not found"
            exit 1
          fi
          
          echo "Pi package structure verified"
      
      - name: E2E Smoke Test
        shell: bash
        run: |
          # Get version from package.json
          VERSION=$(node -p "require('${{ github.workspace }}/package.json').version")
          echo "Testing version: $VERSION"
          
          # Install tarball
          mkdir -p /tmp/e2e-test && cd /tmp/e2e-test
          npm init -y
          TARBALL_PATH="${{ github.workspace }}/pi-agent-bot-${VERSION}.tgz"
          # Convert Windows path to Unix path if needed
          if [[ "$OSTYPE" == "msys" ]] || [[ "$OSTYPE" == "win32" ]]; then
            TARBALL_PATH="$(cygpath -u "$TARBALL_PATH")"
          fi
          npm install "$TARBALL_PATH"
          
          # Start daemon in background
          node node_modules/pi-agent-bot/dist/cli.js serve --dev &
          DAEMON_PID=$!
          
          # Wait for daemon to start
          sleep 5
          
          # Test health endpoint
          curl -f http://localhost:8787/health || (echo "Health check failed" && kill $DAEMON_PID && exit 1)
          
          # Test GUI
          curl -s http://localhost:8787/ | grep -i "<!doctype html>" || (echo "GUI not loading" && kill $DAEMON_PID && exit 1)
          
          # Create a bot
          BOT_ID=$(curl -s -X POST http://localhost:8787/api/bots \
            -H "Content-Type: application/json" \
            -d '{"name":"TestBot","role":"assistant","instructions":"Test","model":{"provider":"mock","modelId":"test"}}' \
            | grep -o '"id":"[^"]*"' | cut -d'"' -f4)
          
          echo "Created bot: $BOT_ID"
          
          # Test SSE endpoint (just check it connects)
          timeout 2 curl -N http://localhost:8787/api/events || true
          
          # Cleanup
          kill $DAEMON_PID
          
          echo "E2E smoke test passed!"

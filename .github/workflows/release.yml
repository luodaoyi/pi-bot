name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Build web
        run: npm run build:web
      
      - name: Type check
        run: npm run typecheck
      
      - name: Lint
        run: npm run lint
      
      - name: Test
        run: npm test
      
      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag version: $TAG"
      
      - name: Verify version matches package.json
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.version.outputs.tag }}"
          echo "Package version: $PACKAGE_VERSION"
          echo "Tag version: $TAG_VERSION"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: package.json version ($PACKAGE_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "✓ Version verification passed"
      
      - name: Determine npm tag
        id: npm_tag
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          if [[ "$VERSION" == *"-"* ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
            echo "Publishing as prerelease (beta tag)"
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "Publishing as stable (latest tag)"
          fi
      
      - name: Upgrade npm for trusted publishing
        run: |
          echo "Current npm version: $(npm --version)"
          npm install -g npm@latest
          echo "Upgraded npm version: $(npm --version)"
      
      - name: Pack tarball
        run: npm pack
      
      - name: Publish to npm with OIDC trusted publishing
        run: |
          npm publish --provenance --access public --tag ${{ steps.npm_tag.outputs.tag }}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: pi-agent-bot-${{ steps.version.outputs.tag }}.tgz
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

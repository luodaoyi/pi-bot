name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  e2e-gui:
    name: e2e-gui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build daemon and web
        shell: bash
        run: |
          npm run build
          npm run build:web
          npm run copy-web
      - name: Install Playwright Chromium
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
      - run: npm run test:e2e
      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-screenshots-${{ matrix.os }}
          path: |
            e2e/screenshots/
            playwright-report/
            test-results/

  release:
    needs: e2e-gui
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Build web
        run: npm run build:web
      
      - name: Type check
        run: npm run typecheck
      
      - name: Lint
        run: npm run lint
      
      - name: Test
        run: npm test
      
      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag version: $TAG"
      
      - name: Verify version matches package.json
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.version.outputs.tag }}"
          echo "Package version: $PACKAGE_VERSION"
          echo "Tag version: $TAG_VERSION"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: package.json version ($PACKAGE_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "✓ Version verification passed"
      
      - name: Determine npm tag
        id: npm_tag
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          if [[ "$VERSION" == *"-"* ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
            echo "Publishing as prerelease (beta tag)"
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "Publishing as stable (latest tag)"
          fi
      
      - name: Upgrade npm for trusted publishing
        run: |
          echo "Current npm version: $(npm --version)"
          npm install -g npm@11
          echo "Upgraded npm version: $(npm --version)"
      
      - name: Pack tarball
        run: npm pack
      
      - name: Check if version already exists on npm
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          if npm view pi-agent-bot@${VERSION} version 2>/dev/null; then
            echo "::error::Version ${VERSION} already exists on npm. Cannot republish."
            echo "::error::Please bump the version in package.json and create a new tag."
            exit 1
          fi
          echo "✓ Version ${VERSION} does not exist on npm, proceeding with publish"
      
      - name: Publish to npm with OIDC trusted publishing
        run: |
          npm publish --provenance --access public --tag ${{ steps.npm_tag.outputs.tag }}
      
      - name: Generate release notes
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          echo "Generating release notes for $TAG_VERSION"
          
          # Find previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 $TAG_VERSION^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            # First release, use first commit  
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
            echo "First release, comparing from initial commit: $PREV_TAG"
          else
            echo "Previous tag: $PREV_TAG"
          fi
          
          # Extract CHANGELOG section for this version
          VERSION_NUMBER="${TAG_VERSION#v}"
          CHANGELOG_SECTION=$(awk "/## \[${VERSION_NUMBER}\]/,/## \[/" CHANGELOG.md | sed '/^## \[/d' | head -50)
          
          if [ -z "$CHANGELOG_SECTION" ]; then
            echo "ERROR: No CHANGELOG.md section found for version $VERSION_NUMBER"
            exit 1
          fi
          
          # Generate commit log grouped by type
          echo "## What's Changed" > release-notes.md
          echo "" >> release-notes.md
          echo "$CHANGELOG_SECTION" >> release-notes.md
          echo "" >> release-notes.md
          echo "## Commits" >> release-notes.md
          echo "" >> release-notes.md
          
          # Group commits by conventional commit type
          git log $PREV_TAG..$TAG_VERSION --pretty=format:"%h %s" --reverse | while read sha msg; do
            # Check if this commit has a PR
            PR_NUM=$(gh pr list --state merged --search "$sha" --json number -q '.[0].number' 2>/dev/null || echo "")
            if [ -n "$PR_NUM" ]; then
              PR_LINK=" ([#$PR_NUM](https://github.com/luodaoyi/pi-bot/pull/$PR_NUM))"
            else
              PR_LINK=""
            fi
            
            echo "- [\`$sha\`](https://github.com/luodaoyi/pi-bot/commit/$sha) $msg$PR_LINK" >> release-notes.md
          done
          
          echo "" >> release-notes.md
          echo "## Installation" >> release-notes.md
          echo "" >> release-notes.md
          echo '```bash' >> release-notes.md
          echo "# Using npm" >> release-notes.md
          echo "npm install -g pi-agent-bot@beta" >> release-notes.md
          echo "" >> release-notes.md
          echo "# Using pnpm" >> release-notes.md
          echo "pnpm add -g pi-agent-bot@beta" >> release-notes.md
          echo "" >> release-notes.md
          echo "# Using Pi CLI" >> release-notes.md
          echo "pi install npm:pi-agent-bot" >> release-notes.md
          echo '```' >> release-notes.md
          echo "" >> release-notes.md
          echo "**Full Changelog**: https://github.com/luodaoyi/pi-bot/compare/$PREV_TAG...$TAG_VERSION" >> release-notes.md
          
          # Fail if release notes are empty or too short
          if [ $(wc -l < release-notes.md) -lt 10 ]; then
            echo "ERROR: Generated release notes are too short or empty"
            cat release-notes.md
            exit 1
          fi
          
          echo "Generated release notes:"
          cat release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create GitHub Release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }} Release" \
            --notes-file release-notes.md \
            --prerelease \
            pi-agent-bot-*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
